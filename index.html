<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PNLE February 2027 Top 1</title>

<!-- =========================================
     FONTS
========================================= -->

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">


<style>

/* =========================================
   RESET
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}


/* =========================================
   PAGE
========================================= */

body {

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    font-family:
        "Nunito Sans",
        sans-serif;

    background:
        #ffffff;

}


/* =========================================
   MAIN BANNER
========================================= */

.banner {

    width: 100%;
    height: 100%;

    min-height: 180px;

    position: relative;

    overflow: hidden;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;


    /* =====================================
       SOFT LAVENDER / WHITE BACKGROUND
    ===================================== */

    background:

        radial-gradient(
            ellipse at 0% 50%,
            rgba(190, 151, 218, .38),
            transparent 40%
        ),

        radial-gradient(
            ellipse at 100% 50%,
            rgba(204, 177, 224, .34),
            transparent 42%
        ),

        radial-gradient(
            ellipse at 50% 0%,
            rgba(239, 229, 246, .85),
            transparent 50%
        ),

        linear-gradient(
            135deg,
            #eee2f5 0%,
            #faf7fc 25%,
            #ffffff 50%,
            #faf6fd 75%,
            #eee2f5 100%
        );


    /* =====================================
       SILVER BORDER
    ===================================== */

    border:

        1px solid
        rgba(168, 159, 175, .48);


    box-shadow:

        inset 0 1px 0
        rgba(255,255,255,.95),

        inset 0 -1px 0
        rgba(255,255,255,.9),

        0 10px 35px
        rgba(112, 82, 126, .10);

}


/* =========================================
   INNER BORDER
========================================= */

.banner::before {

    content: "";

    position: absolute;

    inset: 7px;

    border:

        1px solid
        rgba(192, 162, 211, .42);

    border-radius: 12px;

    pointer-events: none;

}


/* =========================================
   SOFT LIGHT SHIMMER
========================================= */

.banner::after {

    content: "";

    position: absolute;

    width: 45%;
    height: 180%;

    top: -40%;
    left: -55%;

    transform: rotate(18deg);

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.50),
            transparent
        );

    animation:
        shimmer 9s ease-in-out infinite;

    pointer-events: none;

}


@keyframes shimmer {

    0% {
        left: -55%;
        opacity: 0;
    }

    20% {
        opacity: .6;
    }

    45% {
        left: 110%;
        opacity: 0;
    }

    100% {
        left: 110%;
        opacity: 0;
    }

}


/* =========================================
   CONTENT
========================================= */

.content {

    position: relative;

    z-index: 10;

    width: 90%;

    max-width: 1000px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}


/* =========================================
   MAIN TITLE
========================================= */

.title {

    margin: 0;

    font-family:
        "Baloo 2",
        sans-serif;

    font-size:
        clamp(22px, 4vw, 48px);

    font-weight: 800;

    line-height: 1.05;

    letter-spacing:
        .5px;

    color:
        #624d70;

    text-align:
        center;


    /* SOFT SILVER / LAVENDER SHADOW */

    text-shadow:

        0 1px 0
        #ffffff,

        0 2px 0
        rgba(204, 185, 214, .75),

        0 5px 15px
        rgba(126, 91, 145, .15);

}


/* =========================================
   NAME LINE
========================================= */

.name {

    margin-top:
        3px;

    font-family:
        "Baloo 2",
        sans-serif;

    font-size:
        clamp(21px, 3.5vw, 43px);

    font-weight:
        800;

    line-height:
        1.05;

    letter-spacing:
        .5px;

    color:
        #72577f;

    text-align:
        center;

    text-shadow:

        0 1px 0
        #ffffff,

        0 2px 0
        rgba(207, 188, 217, .7);

}


/* =========================================
   MOTTO
========================================= */

.motto {

    margin:

        15px 0 0;

    font-family:
        "Nunito Sans",
        sans-serif;

    font-size:
        clamp(13px, 1.7vw, 19px);

    font-weight:
        500;

    font-style:
        italic;

    line-height:
        1.4;

    letter-spacing:
        .2px;

    color:
        #5e5363;

    text-align:
        center;

    text-shadow:

        0 1px 0
        #ffffff;

}


/* =========================================
   TOP ORNAMENT
========================================= */

.top-ornament {

    position: absolute;

    top: 17px;

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 9px;

    color:
        #a98bbb;

    opacity:
        .85;

    z-index: 5;

}


.top-line {

    width:
        clamp(45px, 10vw, 130px);

    height:
        1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #bda3c9
        );

}


.top-line.right {

    background:

        linear-gradient(
            90deg,
            #bda3c9,
            transparent
        );

}


.top-diamond {

    font-size:
        17px;

    text-shadow:
        0 0 8px rgba(182, 145, 204, .7);

}


/* =========================================
   BOTTOM ORNAMENT
========================================= */

.bottom-ornament {

    position: absolute;

    bottom: 15px;

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 8px;

    color:
        #a98bbb;

    opacity:
        .72;

    z-index: 5;

}


.bottom-line {

    width:
        clamp(45px, 9vw, 115px);

    height:
        1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #b9a0c6
        );

}


.bottom-line.right {

    background:

        linear-gradient(
            90deg,
            #b9a0c6,
            transparent
        );

}


/* =========================================
   DIAMOND SPARKLES
========================================= */

.sparkle {

    position: absolute;

    z-index: 4;

    font-family:
        Georgia,
        serif;

    color:
        #b48bc9;

    line-height:
        1;

    pointer-events:
        none;

    animation:
        diamondTwinkle 2.8s ease-in-out infinite;


    text-shadow:

        0 0 4px
        rgba(255,255,255,.95),

        0 0 9px
        rgba(183, 137, 208, .65),

        0 0 18px
        rgba(191, 151, 216, .3);

}


/* =========================================
   LARGE DIAMONDS
========================================= */

.sparkle.large {

    font-size:
        28px;

}


/* =========================================
   MEDIUM DIAMONDS
========================================= */

.sparkle.medium {

    font-size:
        20px;

}


/* =========================================
   SMALL DIAMONDS
========================================= */

.sparkle.small {

    font-size:
        13px;

}


/* =========================================
   SILVER DIAMONDS
========================================= */

.sparkle.silver {

    color:
        #aaa5b0;

    text-shadow:

        0 0 5px
        #ffffff,

        0 0 10px
        rgba(145, 139, 151, .6);

}


/* =========================================
   DIAMOND TWINKLE
========================================= */

@keyframes diamondTwinkle {

    0%,
    100% {

        opacity:
            .25;

        transform:
            scale(.65)
            rotate(0deg);

    }

    25% {

        opacity:
            .55;

    }

    50% {

        opacity:
            1;

        transform:
            scale(1.35)
            rotate(10deg);

    }

    75% {

        opacity:
            .55;

    }

}


/* =========================================
   LEFT CELESTIAL TRAIL
========================================= */

.trail {

    position: absolute;

    z-index: 2;

    width:
        260px;

    height:
        90px;

    border-top:
        1px solid
        rgba(173, 139, 194, .25);

    border-radius:
        50%;

    transform:
        rotate(-20deg);

    left:
        -80px;

    top:
        20%;

    opacity:
        .7;

}


/* =========================================
   RIGHT CELESTIAL TRAIL
========================================= */

.trail.right {

    left:
        auto;

    right:
        -80px;

    top:
        auto;

    bottom:
        12%;

    transform:
        rotate(-20deg);

}


/* =========================================
   CRESCENT MOON
========================================= */

.moon {

    position: absolute;

    z-index: 6;

    right:
        7%;

    top:
        17%;

    width:
        43px;

    height:
        43px;

    border-radius:
        50%;

    background:

        linear-gradient(
            145deg,
            #ffffff,
            #d8c1e1
        );

    box-shadow:

        0 0 8px
        rgba(174, 139, 194, .5),

        0 0 20px
        rgba(191, 157, 211, .3);

}


/* =========================================
   MOON CUTOUT
========================================= */

.moon::after {

    content: "";

    position: absolute;

    width:
        43px;

    height:
        43px;

    border-radius:
        50%;

    background:
        #f6f0f9;

    left:
        12px;

    top:
        -6px;

}


/* =========================================
   EXTRA LITTLE STARS
========================================= */

.star-dot {

    position: absolute;

    width:
        3px;

    height:
        3px;

    border-radius:
        50%;

    background:
        #b69ac6;

    box-shadow:
        0 0 7px
        rgba(180, 140, 204, .7);

    animation:
        dotTwinkle 2s ease-in-out infinite;

}


@keyframes dotTwinkle {

    0%,
    100% {
        opacity: .2;
    }

    50% {
        opacity: .9;
    }

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .banner {

        min-height:
            160px;

    }

    .content {

        width:
            88%;

    }

    .title {

        font-size:
            22px;

    }

    .name {

        font-size:
            20px;

    }

    .motto {

        margin-top:
            10px;

        font-size:
            12px;

    }

    .moon {

        width:
            30px;

        height:
            30px;

        right:
            4%;

    }

    .moon::after {

        width:
            30px;

        height:
            30px;

        left:
            9px;

    }

    .sparkle.large {

        font-size:
            20px;

    }

}

</style>
</head>


<body>
